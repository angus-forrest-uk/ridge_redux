# Releases: merging release-plz's PR publishes to crates.io. See
# .github/workflows/release-plz.yml.

[workspace]
# Publish only when a release-plz PR is merged, never straight from a push
# (the first push would otherwise publish 0.1.0 at once).
release_always = false
# The built frontend is copied into crates/ridge_redux/dist (gitignored) just
# before publishing, and cargo counts that as uncommitted changes.
publish_allow_dirty = true
# Each crate gets a tag (its changelog links compare between them) and its
# own changelog: the root one for ridge_redux, crates/ridge-core/CHANGELOG.md
# for the library. Only the app gets a GitHub Release.
git_release_enable = false

[[package]]
name = "ridge_redux"
changelog_path = "./CHANGELOG.md"
git_release_enable = true
version_group = "ridge"

[[package]]
name = "ridge-core"
version_group = "ridge"
