name: Release-plz

# On every push to main, release-plz opens or updates a release PR with the
# version bump and changelog. Merging that PR publishes to crates.io, tags
# the commit and creates the GitHub Release.
#
# Secrets:
#   RELEASE_PLZ_TOKEN     a GitHub App token or fine-grained PAT (contents and
#                         pull requests: write). The default GITHUB_TOKEN
#                         would open a release PR that CI never runs on.
#   CARGO_REGISTRY_TOKEN  a crates.io API token with publish rights.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'angus-forrest-uk'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      # The published ridge_redux carries the built frontend.
      - run: npm --prefix web ci
      - run: just bundle
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'angus-forrest-uk'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
