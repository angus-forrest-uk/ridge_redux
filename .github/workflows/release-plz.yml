name: Release-plz

# On every push to main, release-plz opens or updates a release PR with the
# version bump and changelog. Merging that PR publishes to crates.io, tags
# the commit and creates the GitHub Release.
#
# Secrets: CARGO_REGISTRY_TOKEN, a crates.io API token with publish rights.
# The default GITHUB_TOKEN does the rest. A PR it opens doesn't trigger CI,
# which is fine here: the release PR only bumps versions and the changelog.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'angus-forrest-uk'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      # The published ridge_redux carries the built frontend.
      - run: npm --prefix web ci
      - run: just bundle
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # The tag and release this creates with the default GITHUB_TOKEN don't
      # trigger workflows, so hand the Docker image build off explicitly.
      - name: Trigger the Docker image build
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "ridge_redux") | .tag' <<<"$RELEASES")
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            gh api "repos/${{ github.repository }}/dispatches" \
              -f event_type=ridge-redux-released \
              -F "client_payload[tag]=$tag"
          fi

  release-pr:
    name: Release PR
    # After `release`, so the PR is built on the latest release's tag.
    needs: release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'angus-forrest-uk'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
