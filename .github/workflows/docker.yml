name: Docker

# Build and push the app image to ghcr.io on every release, for amd64 and
# arm64. Each platform builds natively, in parallel, on its own runner —
# GitHub's arm64 runners are free for public repos, and QEMU emulation made
# the arm64 compile ~10x slower. Each job pushes its image by digest; a
# merge job then joins them into one multi-platform manifest and tags it.
#
# Release builds arrive as a repository_dispatch from the Release-plz
# workflow: tags and releases it creates with the default GITHUB_TOKEN
# don't trigger workflows, so it hands off explicitly. Pushing an
# `ridge_redux-v*` tag by hand or running this workflow from the Actions
# tab work too. A manual run lands on the `edge` tag by default; give it
# the optional `tag` input (e.g. ridge_redux-v0.4.1) to rebuild a
# release's version tags from main — use it when the release's own build
# failed and the fix only touches build files, so main's code equals the
# tag's code.
#
# Tag policy: every release keeps `X.Y.Z` and `X.Y`, and `latest` moves. To
# keep ONLY the most recent image, delete the two `type=raw` version rules
# (and optionally add a package cleanup workflow — ghcr never expires tags
# on its own).

on:
  push:
    tags: ["ridge_redux-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to version the image with (ridge_redux-vX.Y.Z); empty builds edge
        required: false
        type: string
  repository_dispatch:
    types: [ridge-redux-released]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: github.repository_owner == 'angus-forrest-uk'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          # Dispatches name the release tag, so the image is built from the
          # exact commit that was released.
          ref: ${{ github.event.client_payload.tag || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # One platform per job, merged later: an attestation index would
          # nest inside the merged manifest.
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch scopes, so the two jobs don't thrash one cache.
          cache-from: type=gha,scope=build-${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.scope }}
      - name: Export the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.scope }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.scope }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, tag and smoke test
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'angus-forrest-uk'
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true
      - name: Resolve the image version
        id: ver
        env:
          WANTED_TAG: ${{ github.event.client_payload.tag || inputs.tag || github.ref_name }}
        run: |
          tag="$WANTED_TAG"
          version="${tag#ridge_redux-v}"
          # Not a release tag (a manual run from a branch): don't invent a
          # version, land it on edge.
          if [ "$version" = "$tag" ]; then version=edge; fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "release=$([ "$version" != edge ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platform images and tag them
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.ver.outputs.version }}
          MINOR: ${{ steps.ver.outputs.minor }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          args=()
          for tag in "$VERSION" "$MINOR"; do
            args+=(-t "$image:$tag")
          done
          if [ "$RELEASE" = "true" ]; then
            args+=(-t "$image:latest")
          fi
          digests=()
          for arch in amd64 arm64; do
            d=$(cat "digests/$arch")
            digests+=("$image@sha256:${d#sha256:}")
          done
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
      # The image just shipped: prove it serves. Connections queue until the
      # default scene is prefetched, so the first curl waits for the tiles.
      - name: Smoke test the pushed image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
        run: |
          docker run -d --name ridge -p 8420:8420 "$IMAGE"
          for _ in $(seq 60); do curl -sfm 5 http://127.0.0.1:8420/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8420/ | grep -q '<title>ridge-redux'
          curl -sf http://127.0.0.1:8420/api/presets | grep -q 'White Mountains'
          docker rm -f ridge
