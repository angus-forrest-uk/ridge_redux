<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><style>path{fill:%23000}@media (prefers-color-scheme:dark){path{fill:%23fff}}</style><path d='M50 8 92 92H8Z'/></svg>" />
  <title>ridge-redux — ridgeline terrain art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>ridge<span>-redux</span></h1>
    <div class="header-actions">
      <select id="preset"></select>
      <button id="export-svg" title="Download vector SVG">SVG</button>
      <button id="export-png" title="Rasterize to PNG">PNG</button>
      <button id="readme-open" title="Show the README">README</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="status">ready</div>
      <div id="hint">drag to pan · wheel to zoom · double-click to reset</div>
    </div>

    <aside id="controls"></aside>
  </main>

  <section id="map-panel">
    <div id="map-panel-head" title="click to collapse / expand">
      <span>location map — move to explore, select to pick the area</span>
      <button id="map-toggle">hide</button>
    </div>
    <div id="map-body">
      <div id="map"></div>
      <div id="map-tools" role="group" aria-label="map tool">
        <button id="map-tool-move" class="active" aria-pressed="true" title="Move: drag to pan the map">move</button>
        <button id="map-tool-select" aria-pressed="false" title="Select: drag to draw the area (or hold Shift in move mode)">select</button>
      </div>
      <div id="map-hint">gray = beyond SRTM coverage (±60° latitude) · tiles © OpenStreetMap</div>
    </div>
  </section>

  <dialog id="readme">
    <form method="dialog"><button>close</button></form>
    <pre id="readme-text">loading…</pre>
  </dialog>

  <script src="/vendor/leaflet.js"></script>
  <script src="/main.js"></script>
</body>
</html>
