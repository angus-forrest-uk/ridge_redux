[workspace]
resolver = "2"
members = ["crates/ridge-core", "crates/ridge_redux"]
# A bare `cargo run` starts the app, not ridge-core's `render` CLI.
default-members = ["crates/ridge_redux"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Angus Forrest"]
repository = "https://github.com/angus-forrest-uk/ridge_redux"
readme = "README.md"
categories = ["science::geo", "visualization"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = "0.17"
flate2 = "1"
colorous = "1"

[profile.release]
opt-level = 3
