[workspace]
resolver = "2"
members = ["crates/ridge-core", "crates/ridge_redux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ridge-redux contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = "0.16"
flate2 = "1"
colorous = "1"

[profile.release]
opt-level = 3
