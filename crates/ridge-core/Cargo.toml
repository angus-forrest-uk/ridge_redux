[package]
name = "ridge-core"
description = "Ridgeline terrain art pipeline: SRTM fetch, preprocess, geometry, SVG"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["srtm", "elevation", "terrain", "ridgeline", "svg"]
include = ["src/**/*", "examples/**/*", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE-upstream"]

[dependencies]
ndarray = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
colorous = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
dirs = "7.0.0"
# Used only by the `render` binary.
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "render"
path = "src/bin/render.rs"
