[package]
name = "ridge_redux"
description = "Interactive ridgeline maps of real terrain, as a local web app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["ridgeline", "terrain", "map", "srtm", "art"]
# dist/ is the built frontend, copied in by `just package` (it's gitignored).
include = ["src/**/*", "build.rs", "dist/**/*", "LICENSE", "LICENSE-upstream"]

[[bin]]
name = "ridge_redux"
path = "src/main.rs"

[dependencies]
ridge-core = { path = "../ridge-core", version = "0.1.0" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "trace", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
ndarray = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path", "mime-guess"] }
open = "5.4.4"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
name = "ridge_redux"
path = "src/lib.rs"
